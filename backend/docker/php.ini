; ──────────────────────────────────────────────────────────────
; PHP 8.3 — Configuration Sortie d'école
; ──────────────────────────────────────────────────────────────

[PHP]
; Fuseau horaire — Africa/Casablanca (jamais de décalage fixe)
date.timezone = Africa/Casablanca

; Upload photos
upload_max_filesize = 10M
post_max_size = 10M

; Mémoire
memory_limit = 256M
max_execution_time = 60

; Opcache (production)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1

; Sécurité
expose_php = Off
display_errors = Off
log_errors = On
