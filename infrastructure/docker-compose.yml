# ──────────────────────────────────────────────────────────────
# Sortie d'école — Docker Compose (Développement)
# ──────────────────────────────────────────────────────────────
# Services : app (Laravel API), postgresql, redis, reverb,
#            minio, nginx, filament (admin)
# Les apps Flutter sont compilées localement (pas dans Docker).
# ──────────────────────────────────────────────────────────────

name: sortie-ecole

services:
  # ── Laravel API ──────────────────────────────────────────────
  app:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    container_name: sortie-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../backend:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: sortie_ecole
      DB_USERNAME: sortie
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      FILESYSTEM_DISK: minio
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: sortie-minio
      AWS_SECRET_ACCESS_KEY: sortie-minio-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: photos
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sortie-net

  # ── PostgreSQL 16 ───────────────────────────────────────────
  postgresql:
    image: postgres:16-alpine
    container_name: sortie-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: sortie_ecole
      POSTGRES_USER: sortie
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortie -d sortie_ecole"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sortie-net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sortie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sortie-net

  # ── Laravel Reverb (WebSockets) ─────────────────────────────
  reverb:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    container_name: sortie-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ../backend:/var/www
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: sortie_ecole
      DB_USERNAME: sortie
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sortie-net

  # ── MinIO (Stockage privé photos) ──────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: sortie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sortie-minio
      MINIO_ROOT_PASSWORD: sortie-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - sortie-net

  # ── Nginx (Proxy backend) ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sortie-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ../backend/public:/var/www/public:ro
    depends_on:
      - app
    networks:
      - sortie-net

  # ── Filament Admin (sous-domaine admin.sortie-ecole.ma) ────
  filament:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    container_name: sortie-filament
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../backend:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://admin.sortie-ecole.ma
      DB_CONNECTION: pgsql
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: sortie_ecole
      DB_USERNAME: sortie
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILAMENT_DOMAIN: admin.sortie-ecole.ma
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sortie-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  sortie-net:
    driver: bridge
