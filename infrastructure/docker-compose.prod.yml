# ──────────────────────────────────────────────────────────────
# Sortie d'école — Docker Compose (Production)
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────

services:
  app:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  postgresql:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    restart: always

  reverb:
    restart: always
    environment:
      APP_ENV: production

  minio:
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  nginx:
    restart: always

  filament:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://admin.sortie-ecole.ma
