name: app_parent
description: "Sortie d'école — Application mobile tuteurs (iOS/Android)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Packages partagés monorepo ──────────────────────────────
  sortie_models:
    path: ../packages/sortie_models
  sortie_ui:
    path: ../packages/sortie_ui

  # ── État & Architecture ─────────────────────────────────────
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  injectable: ^2.5.0

  # ── Réseau & API ───────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.0

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.6.0

  # ── Localisation FR/AR ─────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: any

  # ── Horloge injectable (jamais DateTime.now() direct) ──────
  clock: ^1.1.1

  # ── Notifications push (payload opaque uniquement) ─────────
  firebase_messaging: ^15.1.0
  firebase_core: ^3.6.0

  # ── Géolocalisation (in_radius uniquement, pas de stockage) ─
  geolocator: ^13.0.2

  # ── Stockage sécurisé ──────────────────────────────────────
  flutter_secure_storage: ^9.2.0

  # ── UI ─────────────────────────────────────────────────────
  cached_network_image: ^3.4.0

  # ── UUID & WebSockets Reverb ───────────────────────────────
  uuid: ^4.5.0
  dart_pusher_channels: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  injectable_generator: ^2.7.0
  retrofit_generator: ^10.2.12
  json_serializable: ^6.8.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true

  # ── Fichiers ARB pour le bilinguisme FR/AR ─────────────────
  # Voir lib/l10n/app_fr.arb et lib/l10n/app_ar.arb
