openapi: "3.1.0"
info:
  title: Sortie d'école API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: UNLICENSED
  description: |
    API de gestion sécurisée des sorties scolaires.
    Source de vérité du projet (ADR 0001 — Contract-First).
  contact:
    name: Équipe Sortie d'école

servers:
  - url: https://api.sortie-ecole.ma/v1
    description: Production (VPS Maroc)
  - url: http://127.0.0.1:8000/api/v1
    description: Développement local

# ─── Sécurité ───────────────────────────────────────────────────────────────
security:
  - sanctum: []

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  # ─── Schemas réutilisables (à compléter feature par feature) ──────────────
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [message]

    LoginRequest:
      type: object
      properties:
        phone:
          type: string
      required: [phone]

    VerifyRequest:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
      required: [phone, code]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
      required: [token, user]

    QueueItem:
      type: object
      description: >
        Carte d'un enfant dans la file d'attente de la tablette d'accueil (F02).
        Données minimisées : pas de téléphone, pas de coordonnées GPS (Loi 09-08).
      properties:
        id:
          type: string
          format: uuid
          description: UUID de la PickupRequest
        child_id:
          type: string
          format: uuid
        child_name:
          type: string
          description: Prénom et nom de l'élève
          example: "Yasmine El Fassi"
        class_name:
          type: string
          description: Classe de l'élève
          example: "CE2-A"
        status:
          type: string
          enum:
            - requested
            - pending_agent_confirmation
            - class_notified
            - on_the_way
          description: Statuts actifs uniquement. Les statuts terminaux ne sont jamais retournés.
        waiting_zone:
          type: ["string", "null"]
          description: Zone d'attente physique (ex. "Portail A")
          example: "Portail A"
        photo_url:
          type: ["string", "null"]
          format: uri
          description: URL MinIO signée temporaire (durée ≤ 5 minutes). Null si aucune photo.
        created_at:
          type: string
          format: date-time
          description: Horodatage du signalement d'arrivée (tri chronologique)
      required:
        - id
        - child_id
        - child_name
        - class_name
        - status
        - created_at

    HandoverLog:
      type: object
      description: >
        Journal légal de remise, append-only (trigger PostgreSQL).
        Conforme à la Loi 09-08 — aucune coordonnée GPS, téléphone masqué.
      properties:
        id:
          type: string
          format: uuid
        pickup_request_id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
          description: UUID de l'agent d'accueil ayant validé la remise
        collector_type:
          type: string
          enum:
            - parent
            - authorized_person
            - daily_code
            - pickup_card
          description: Type de récupérateur de l'enfant
        parent_user_id:
          type: ["string", "null"]
          format: uuid
          description: UUID opaque du parent titulaire si collector_type = parent
        authorized_person_id:
          type: ["string", "null"]
          format: uuid
          description: UUID de la personne autorisée si collector_type = authorized_person
        created_at:
          type: string
          format: date-time
      required:
        - id
        - pickup_request_id
        - school_id
        - agent_id
        - collector_type
        - created_at

    HandoverRequest:
      type: object
      description: Corps de la requête de remise (POST .../handover)
      properties:
        collector_type:
          type: string
          enum:
            - parent
            - authorized_person
            - daily_code
            - pickup_card
        parent_user_id:
          type: ["string", "null"]
          format: uuid
        authorized_person_id:
          type: ["string", "null"]
          format: uuid
      required:
        - collector_type

    ConfirmPresenceResponse:
      type: object
      description: Réponse après validation manuelle de la présence d'un parent hors rayon
      properties:
        id:
          type: string
          format: uuid
          description: UUID de la PickupRequest mise à jour
        status:
          type: string
          enum:
            - requested
      required: [id, status]

    ArrivalSignalRequest:
      type: object
      properties:
        child_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: Identifiants des élèves concernés (fratrie)
        in_radius:
          type: boolean
          description: Le parent est-il dans le rayon autorisé (200-300m)
        distance_meters:
          type: integer
          minimum: 0
          description: Distance arrondie aux 10m supérieurs (Loi 09-08)
      required: [child_ids, in_radius]

    PickupRequestSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        child_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - requested
            - pending_agent_confirmation
            - class_notified
            - on_the_way
            - handed_over
            - cancelled
            - expired
        in_radius:
          type: boolean
        distance_meters:
          type: ["integer", "null"]
        created_at:
          type: string
          format: date-time
      required: [id, child_id, status]

    ArrivalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        in_radius:
          type: boolean
        distance_meters:
          type: ["integer", "null"]
        pickup_requests:
          type: array
          items:
            $ref: '#/components/schemas/PickupRequestSummary'
        created_at:
          type: string
          format: date-time
      required: [id, school_id, user_id, in_radius, pickup_requests, created_at]

    ArrivalStatusResponse:
      type: object
      properties:
        arrival:
          $ref: '#/components/schemas/ArrivalResponse'
        pickup_requests:
          type: array
          items:
            $ref: '#/components/schemas/PickupRequestSummary'
      required: [arrival, pickup_requests]

    PickupActionResponse:
      type: object
      description: >
        Réponse après une action de transition sur une PickupRequest
        (call, depart). Symétrique de ConfirmPresenceResponse.
      properties:
        id:
          type: string
          format: uuid
          description: UUID de la PickupRequest mise à jour
        status:
          type: string
          description: Nouveau statut après transition
          enum:
            - class_notified
            - on_the_way
        updated_at:
          type: string
          format: date-time
          description: Horodatage de la transition en Africa/Casablanca
      required: [id, status, updated_at]


# ─── Paths (F01, F02, F03, F04) ─────────────────────────────────────────────
paths:
  /auth/login:
    post:
      operationId: loginRequest
      summary: Demander un code SMS (F01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Code envoyé
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify:
    post:
      operationId: verifyCode
      summary: Vérifier le code SMS et obtenir un jeton (F01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Code invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/students/import:
    post:
      operationId: importStudents
      summary: Importer des élèves via CSV (F01)
      security:
        - sanctum: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import réussi
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: École introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/queue:
    get:
      operationId: getQueue
      summary: Récupérer la file d'attente de la tablette (F02)
      description: >
        Retourne les PickupRequest actives du jour (00:00:00 Africa/Casablanca),
        triées par created_at ascendant. Statuts retournés : requested,
        pending_agent_confirmation, class_notified, on_the_way.
        Accès restreint aux rôles concierge, surveillant et director.
        Le rôle surveillant reçoit uniquement les demandes au statut
        class_notified de sa propre école (filtre serveur). Les rôles
        concierge et director reçoivent la file complète.
      security:
        - sanctum: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File d'attente du jour, triée par heure d'arrivée
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
        '403':
          description: Non autorisé (rôle insuffisant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: École introuvable (isolation multi-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/pickup-requests/{requestId}/handover:
    post:
      operationId: markHandover
      summary: Marquer un enfant comme "Remis" (F02)
      description: >
        Transition vers handed_over autorisée depuis tout statut actif.
        Écrit une ligne immuable dans handover_logs (append-only).
        L'en-tête Idempotency-Key est obligatoire pour garantir la
        cohérence en mode déconnecté (Drift).
      security:
        - sanctum: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUIDv4 généré par la tablette. Garantit l'idempotence. Obligatoire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
      responses:
        '201':
          description: Remise enregistrée (ajout au journal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverLog'
        '409':
          description: Demande déjà remise (handed_over) — idempotent, renvoie le log original
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoverLog'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requête ou école introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Statut déjà terminal (cancelled, expired) ou Idempotency-Key manquante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/pickup-requests/{requestId}/confirm-presence:
    post:
      operationId: confirmPresence
      summary: Valider manuellement la présence d'un parent hors rayon (F02 — CA4)
      description: >
        Transition pending_agent_confirmation → requested.
        Disponible uniquement si le statut courant est pending_agent_confirmation.
        Accessible uniquement aux rôles concierge et director.
      security:
        - sanctum: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Présence confirmée — statut mis à jour vers requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmPresenceResponse'
        '403':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requête ou école introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Statut incompatible (la demande n'est pas pending_agent_confirmation)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/pickup-requests/{requestId}/call:
    post:
      operationId: callClass
      summary: Appeler la classe d'un enfant (F04)
      description: >
        Transition requested → class_notified. Déclenchée par l'agent
        d'accueil (concierge ou director). Diffuse l'événement Reverb
        pickup.called sur le canal school.{schoolId}.queue. Idempotent
        via l'en-tête Idempotency-Key.
      security:
        - sanctum: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUIDv4 généré par le client. Garantit l'idempotence. Obligatoire.
      responses:
        '200':
          description: Classe appelée — statut mis à jour vers class_notified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupActionResponse'
        '403':
          description: Rôle insuffisant (seuls concierge et director peuvent appeler)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: École ou requête introuvable (isolation multi-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflit d'idempotence (même clé, corps différent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transition invalide (la demande n'est pas au statut requested)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/pickup-requests/{requestId}/depart:
    post:
      operationId: markDepart
      summary: Marquer un enfant comme « Parti » par le surveillant (F04)
      description: >
        Transition class_notified → on_the_way. Déclenchée par le
        surveillant ou le director. Diffuse l'événement Reverb
        pickup.departed sur le canal school.{schoolId}.queue. Idempotent
        via l'en-tête Idempotency-Key. Un second appel avec une clé
        différente sur une demande déjà on_the_way renvoie 200 (idempotence
        d'état) ; le 409 est réservé au conflit de clé.
      security:
        - sanctum: []
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUIDv4 généré par le client. Garantit l'idempotence. Obligatoire.
      responses:
        '200':
          description: Départ enregistré — statut mis à jour vers on_the_way
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupActionResponse'
        '403':
          description: Rôle insuffisant (seuls surveillant et director peuvent libérer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: École ou requête introuvable (isolation multi-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflit d'idempotence (même clé, corps différent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Transition invalide (la demande n'est pas au statut class_notified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/arrivals:
    post:
      operationId: signalArrival
      summary: Signaler son arrivée devant l'école (F03)
      description: |
        Déclenché par le parent pendant la fenêtre autorisée.
        Regroupe une fratrie sous un Arrival unique et génère les PickupRequest associées.
        Respecte la loi 09-08 (aucune coordonnée GPS brute stockée).
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Clé d'idempotence pour éviter les doubles signalements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrivalSignalRequest'
      responses:
        '201':
          description: Arrivée signalée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalResponse'
        '404':
          description: École ou élève introuvable (isolation multi-école)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Hors fenêtre horaire ou validation invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Non implémenté (phase squelette)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /schools/{schoolId}/arrivals/status:
    get:
      operationId: getArrivalStatus
      summary: Consulter le statut de la dernière arrivée
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statut de l'arrivée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalStatusResponse'
        '404':
          description: Aucune arrivée active ou école introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Non implémenté (phase squelette)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

