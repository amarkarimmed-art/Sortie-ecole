# ──────────────────────────────────────────────────────────────
# Nginx — Reverse proxy pour Laravel API pure
# Backend uniquement, pas de frontend.
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.sortie-ecole.ma localhost;

    root /var/www/public;
    index index.php;

    charset utf-8;

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/sortie-access.log;
    error_log  /var/log/nginx/sortie-error.log;

    # ── Taille max upload (photos) ───────────────────────────
    client_max_body_size 10M;

    # ── Routes API ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── Interdire .env, .git, etc. ───────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── Admin Filament (sous-domaine) ────────────────────────────
server {
    listen 80;
    server_name admin.sortie-ecole.ma;

    root /var/www/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass filament:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
