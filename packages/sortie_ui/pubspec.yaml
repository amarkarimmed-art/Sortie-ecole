name: sortie_ui
description: >
  Design system commun : thème, composants, RTL, FR/AR.
  Partagé entre app_parent et app_ecole.
  Ce package ne connaît pas le backend Laravel.
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Localisation FR/AR ─────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
