name: app_ecole
description: "Sortie d'école — App tablette d'accueil + surveillant (Offline-First)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Packages partagés monorepo ──────────────────────────────
  sortie_models:
    path: ../packages/sortie_models
  sortie_ui:
    path: ../packages/sortie_ui

  # ── État & Architecture ─────────────────────────────────────
  flutter_bloc: ^8.1.0
  equatable: ^2.0.0
  get_it: ^8.0.0
  injectable: ^2.5.0

  # ── Réseau & API ───────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.0

  # ── Navigation ─────────────────────────────────────────────
  go_router: ^14.6.0

  # ── Localisation FR/AR ─────────────────────────────────────
  flutter_localizations:
    sdk: flutter
  intl: any

  # ── Horloge injectable (jamais DateTime.now() direct) ──────
  clock: ^1.1.1

  # ── Drift — Offline-First (ADR 0007) ──────────────────────
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # ── WebSockets (Laravel Reverb) ────────────────────────────
  web_socket_channel: ^3.0.0

  # ── UUID pour idempotency keys ─────────────────────────────
  uuid: ^4.5.0

  # ── Connectivité ───────────────────────────────────────────
  connectivity_plus: ^6.1.0

  # ── UI ─────────────────────────────────────────────────────
  cached_network_image: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  injectable_generator: ^2.7.0
  retrofit_generator: ^9.1.0
  json_serializable: ^6.8.0
  drift_dev: ^2.22.0
  bloc_test: ^9.1.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  generate: true
